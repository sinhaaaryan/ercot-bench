# RL smoke test on ONE GPU (e.g. RTX 5090 32GB): trainer and an externally started vLLM share the GPU.
# No [inference] section => the launcher gives the trainer GPU 0 and uses the external server
# (weights are broadcast via the filesystem to its /update_weights endpoint).
#
#   # terminal 1 (inference, ~35% of the GPU; VLLM_USE_V2_MODEL_RUNNER=0 needed on WSL2)
#   VLLM_USE_V2_MODEL_RUNNER=0 uv run inference --vllm.model <model> --vllm.gpu-memory-utilization 0.35 --vllm.max-model-len 8192
#   # terminal 2
#   uv run rl @ ../ercot-bench/grid-analyst/configs/prime-rl/rl_smoke_1gpu.toml --model.name <model> --run.name ercot-smoke
# Done when reward/ercot-sql-smoke/mean is logged and varies across steps.
max_steps = 10
seq_len = 4096

[model]
name = "Qwen/Qwen3-1.7B"

[orchestrator]
batch_size = 16
group_size = 8

[orchestrator.model.client]
base_url = "http://localhost:8000/v1"

[orchestrator.train.sampling]
max_completion_tokens = 768
temperature = 1.0

[[orchestrator.train.source]]
name = "ercot-sql-smoke"
env.taskset.id = "ercot-sql"
env.taskset.split = "train"
env.taskset.subset_size = 64
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 2e-6

# fine-tuned checkpoints are not in the renderer map; they keep the Qwen3 chat template
[orchestrator.renderer]
name = "qwen3"
enable_thinking = false
