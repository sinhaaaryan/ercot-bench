# Smoke test: tiny model, few steps, proves env + reward plumbing inside prime-rl (1-2 GPUs).
#   uv run rl @ /path/to/ercot-bench/configs/prime-rl/rl_smoke.toml --run.name ercot-smoke
# Done when reward/ercot-sql-smoke/mean is logged and not constant across steps.
max_steps = 10
seq_len = 6144

[model]
name = "Qwen/Qwen3-0.6B"

[orchestrator]
batch_size = 16
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 512
temperature = 1.0

[[orchestrator.train.source]]
name = "ercot-sql-smoke"
env.taskset.id = "ercot-sql"
env.taskset.split = "train"
env.taskset.subset_size = 64
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[inference]
