[project]
name = "ercot-sql"
version = "0.1.0"
description = "ERCOT-Bench single-turn text-to-SQL taskset for verifiers v1 / prime-rl"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.1",
    "ercot-bench",
]

[tool.uv.sources]
ercot-bench = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ercot_sql"]
