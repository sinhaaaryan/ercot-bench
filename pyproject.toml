[project]
name = "ercot-bench"
version = "0.1.0"
description = "Verifiable ERCOT grid-data SQL environment for LLM eval and post-training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gridstatus",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlglot>=25",
    "tzdata",
]

[project.optional-dependencies]
api = ["anthropic", "openai"]

[project.scripts]
ercot-bench = "ercot_bench.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ercot_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
