[project]
name = "ercot-uncertainty-env"
version = "0.1.0"
description = "ERCOT day-ahead load-forecast uncertainty (p10/p50/p90) single-turn taskset for verifiers v1 / prime-rl"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.1",
    "ercot-uncertainty",
]

# Not pip-installed into /hackathon/prime-rl/.venv (read-only for us). The launch commands put
# /hackathon-new/src and this directory on PYTHONPATH instead; see docs/TRAINING.md.
[tool.uv.sources]
ercot-uncertainty = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ercot_uncertainty_env"]
