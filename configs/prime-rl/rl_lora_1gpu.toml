# Memory-safe single-GPU RL (one 32 GB GPU, 40 GB host RAM, no swap) from the SFT checkpoint.
# LoRA + optimizer on GPU: full fine-tuning with prime-rl's default optimizer CPU offload puts ~20-27 GB of
# Adam state in host RAM for a 1.7B model, which (with vLLM + orchestrator + env workers) OOM'd the WSL VM.
#
#   scripts/mem_guard.sh &     # pauses ercot-* jobs before RAM/VRAM run out
#   VLLM_USE_V2_MODEL_RUNNER=0 scripts/guarded_run.sh infer 10G uv run inference --vllm.model <sft weights> \
#       --vllm.gpu-memory-utilization 0.35 --vllm.max-model-len 8192 --vllm.enable-lora --vllm.max-lora-rank 16
#   scripts/guarded_run.sh rl 20G uv run rl @ ../ercot-bench/configs/prime-rl/rl_lora_1gpu.toml \
#       --model.name <sft weights> --run.name ercot-rl-lora
max_steps = 15
seq_len = 4096

[model]
name = "Qwen/Qwen3-1.7B"   # override with the SFT checkpoint (HF-format weights dir)

[trainer.model]
optim_cpu_offload = false

[trainer.model.lora]
rank = 16
alpha = 32.0

[orchestrator]
batch_size = 16
group_size = 8

[orchestrator.model.client]
base_url = "http://localhost:8000/v1"

[orchestrator.train.sampling]
max_completion_tokens = 768
temperature = 1.0

[[orchestrator.train.source]]
name = "ercot-sql-rl"
env.taskset.id = "ercot-sql"
env.taskset.split = "../ercot-bench/data/tasks/rl_train.jsonl"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 1e-5

# fine-tuned checkpoints are not in the renderer map; they keep the Qwen3 chat template
[orchestrator.renderer]
name = "qwen3"
enable_thinking = false
